[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua"
version = "0.1.0"
description = "Personal AI assistant for research and studies"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "openai>=1.0",
    "chromadb>=0.4.0",
    "pypdf>=3.0",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.scripts]
aqua = "aqua.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
