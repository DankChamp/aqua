[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua"
version = "0.2.0"
description = "Personal AI assistant for research and studies"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
all = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.7.0",
    "pypdf>=6.16.1",
]

[project.scripts]
aqua = "cli.aqua:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "cli*", "config*"]
